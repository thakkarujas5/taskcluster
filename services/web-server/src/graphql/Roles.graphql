type RoleCompact {
  roleId: ID
}

type RolesConnection implements Connection {
  pageInfo: PageInfo
  edges: [RolesEdge]
}

type RolesEdge implements Edge {
  cursor: String
  node: RoleCompact
}

extend type Query {
  # List Role IDs
  listRoleIds(connection: PageConnection, searchTerm: String): RolesConnection
}
