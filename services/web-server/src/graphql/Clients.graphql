type Client {
  clientId: ID!
  expires: DateTime!
  deleteOnExpiration: Boolean!
  description: String!
  created: DateTime!
  lastModified: DateTime!
  lastDateUsed: DateTime!
  lastRotated: DateTime!
  scopes: [String]!
  expandedScopes: [String]!
  disabled: Boolean!
}

type ClientsConnection implements Connection {
  pageInfo: PageInfo
  edges: [ClientsEdge]
}

type ClientsEdge implements Edge {
  cursor: String
  node: Client
}

input ClientsOptions {
  prefix: String
}

extend type Query {
  clients(clientOptions: ClientsOptions, connection: PageConnection, searchTerm: String): ClientsConnection
}
